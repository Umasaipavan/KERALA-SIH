<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <circle cx="200" cy="200" r="180" fill="none" stroke="#2563eb" stroke-width="6"/>
  
  <!-- Government of Kerala text (top arc) -->
  <path id="top-arc" d="M 80 200 A 120 120 0 0 1 320 200" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#2563eb">
    <textPath href="#top-arc" startOffset="25%">GOVERNMENT OF KERALA</textPath>
  </text>
  
  <!-- Digital Health Record text (bottom arc) -->
  <path id="bottom-arc" d="M 320 200 A 120 120 0 0 1 80 200" fill="none"/>
  <text font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#2563eb">
    <textPath href="#bottom-arc" startOffset="20%">DIGITAL HEALTH RECORD</textPath>
  </text>
  
  <!-- Kerala map outline -->
  <path d="M 160 140 Q 165 130 175 135 Q 185 140 190 150 Q 195 160 200 170 Q 205 180 210 190 Q 215 200 220 210 Q 225 220 230 230 Q 225 240 220 250 Q 215 260 210 270 Q 200 275 190 270 Q 180 265 170 260 Q 160 250 155 240 Q 150 230 150 220 Q 150 210 155 200 Q 160 190 160 180 Q 160 170 160 160 Q 160 150 160 140 Z" fill="#f0f9ff" stroke="#2563eb" stroke-width="2"/>
  
  <!-- Medical cross with leaf -->
  <g transform="translate(200, 180)">
    <!-- Cross -->
    <rect x="-15" y="-25" width="30" height="50" fill="#2563eb" rx="3"/>
    <rect x="-25" y="-15" width="50" height="30" fill="#2563eb" rx="3"/>
    
    <!-- Leaf -->
    <path d="M 10 -10 Q 25 -15 30 -5 Q 25 5 10 0 Z" fill="#84cc16"/>
  </g>
  
  <!-- Family figures -->
  <g transform="translate(180, 230)">
    <!-- Adult figure 1 -->
    <circle cx="0" cy="0" r="8" fill="#2563eb"/>
    <rect x="-6" y="8" width="12" height="20" fill="#2563eb" rx="2"/>
    <rect x="-4" y="12" width="8" height="12" fill="#f0f9ff"/>
    
    <!-- Adult figure 2 -->
    <circle cx="20" cy="0" r="8" fill="#2563eb"/>
    <rect x="14" y="8" width="12" height="20" fill="#2563eb" rx="2"/>
    <rect x="16" y="12" width="8" height="12" fill="#f0f9ff"/>
    
    <!-- Child figure -->
    <circle cx="10" cy="5" r="6" fill="#2563eb"/>
    <rect x="6" y="11" width="8" height="15" fill="#2563eb" rx="2"/>
    <rect x="7" y="14" width="6" height="10" fill="#f0f9ff"/>
  </g>
</svg>